name: Release

on:
  push:
    branches:
      - main
  # Permite relanzar la publicación a mano sin tener que empujar a main,
  # que es lo que hacía falta cuando un build fallaba por causas ajenas
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Cada arquitectura se construye en un runner de su propia arquitectura y se
  # sube por digest, sin etiqueta. Nada de QEMU: emular arm64 sobre amd64
  # reventaba en `npm ci` con "Illegal instruction" (exit 132), primero de
  # forma intermitente y después siempre.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # Runner ARM nativo, gratuito en repositorios públicos
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./code
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Caché por plataforma: compartirla entre arquitecturas no sirve
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Une los digests de las dos arquitecturas en un único índice y le pone las
  # etiquetas. Es lo que hace que `docker pull` traiga la variante correcta.
  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./code/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.package-version.outputs.version }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.package-version.outputs.version }}

  version:
    name: Work out the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: version
        name: Is this version released yet
        run: |
          set -euo pipefail
          version=$(node -p "require('./code/package.json').version")
          release=true
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            release=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "### v${version}: release ${release}" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            targets: mac-arm64 mac-x64
          - name: Windows
            runner: windows-latest
            targets: win-x64
          - name: Linux
            runner: ubuntu-latest
            targets: linux-x64 linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            code/package-lock.json

      - name: Install the desktop tooling
        working-directory: ./desktop
        run: npm ci

      - name: Build the installers
        shell: bash
        run: node desktop/scripts/dist.js ${{ matrix.targets }}

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 3

  release:
    name: GitHub release
    needs: [version, publish, desktop]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          ## Docker

          \`\`\`bash
          docker pull ${REGISTRY}/${IMAGE_NAME}:${VERSION}
          \`\`\`

          ## Desktop

          | System | File |
          | --- | --- |
          | macOS, Apple Silicon | \`Mock-Server-${VERSION}-mac-arm64.dmg\` |
          | macOS, Intel | \`Mock-Server-${VERSION}-mac-x64.dmg\` |
          | Windows | \`Mock-Server-${VERSION}-win-x64.exe\` |
          | Linux x64 | \`Mock-Server-${VERSION}-linux-x86_64.AppImage\` |
          | Linux ARM | \`Mock-Server-${VERSION}-linux-arm64.AppImage\` |

          The installers are not signed. On macOS, open the app once from System Settings, Privacy & Security, Open Anyway. On Windows, SmartScreen asks once: More info, Run anyway.

          NOTES
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --generate-notes
